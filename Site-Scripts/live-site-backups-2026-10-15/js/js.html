<!-- Gallery mosaic + lightbox layout. Was injected by the mosaic JS on DOMContentLoaded, which
     flashed the raw Divi grid first (CLS). body:not(.et-fb) keeps the builder showing the real gallery. -->
<style id="hs-modal-cache-buster">
    /* Nuke pseudo elements */
    .mfp-close::before, .mfp-close::after,
    .mfp-wrap .mfp-close::before, .mfp-image-holder .mfp-close::before,
    .mfp-wrap .mfp-close::after, .mfp-image-holder .mfp-close::after,
    .hs-shared-close::before, .hs-shared-close::after {
        content: none !important;
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
    }
    
    /* Aggressively force identical positioning and layout */
    #school-gallery-popup .hs-shared-close,
    .mfp-wrap .mfp-close,
    .mfp-image-holder .mfp-close {
        position: fixed !important;
        top: 24px !important;
        right: 24px !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        margin: 0 !important;
        line-height: 1 !important;
        box-sizing: border-box !important;
        appearance: none !important;
        -webkit-appearance: none !important;
    }
    
    /* Force exact text node spacing */
    .hs-modal-close-text {
        margin: 0 !important;
        padding: 0 !important;
        line-height: normal !important;
    }
    .hs-modal-close-icon {
        margin: -3px 0 0 0 !important;
        padding: 0 !important;
        line-height: 1 !important;
    }
    
    /* Mobile exact position overrides */
    @media (max-width: 767px) {
        #school-gallery-popup .hs-shared-close,
        .mfp-wrap .mfp-close,
        .mfp-image-holder .mfp-close {
            top: 16px !important;
            right: 16px !important;
            margin: 0 !important;
        }
    }
    
    /* FORCE CACHE BUST FOR PAGINATION WRAPPERS */
    body:not(.et-fb) .hs-inline-mosaic .et_pb_gallery_items,
    body:not(.et-fb) .hs-inline-mosaic .et_pb_gallery_pagination,
    body:not(.et-fb) .hs-inline-mosaic .et_pb_gallery_title,
    body:not(.et-fb) .hs-inline-mosaic .et_overlay {
        display: none !important;
    }
    
    body:not(.et-fb) .hs-inline-mosaic-wrapper {
        display: grid !important;
        grid-template-columns: 1fr !important;
        grid-template-rows: 1fr !important;
        align-items: start !important;
        transition: height 0.6s ease !important;
        overflow: hidden !important;
    }
    body:not(.et-fb) .hs-inline-mosaic-wrapper .hs-mosaic-grid {
        grid-area: 1 / 1 !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        transform: translateY(5px) !important;
        transition: opacity 0.6s ease, transform 0.6s ease, visibility 0.6s ease !important;
        z-index: 1 !important;
    }
    body:not(.et-fb) .hs-inline-mosaic-wrapper .hs-mosaic-grid.hs-active-grid {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
        transform: translateY(0) !important;
        z-index: 2 !important;
    }
</style>
